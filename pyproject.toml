[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eduwisp-protocol"
version = "0.0.1"
description = "Specifica e schemi JSON del protocollo tra il server EduWISP e gli agenti sui dispositivi"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.13"
authors = [{ name = "Michele Salerno e i contributori di EduWISP" }]
dependencies = ["jsonschema>=4.23"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/EduWISP/eduwisp-protocol"
Documentation = "https://eduwisp.org/docs/"

[tool.setuptools.packages.find]
include = ["eduwisp_protocol*"]

[tool.setuptools.package-data]
eduwisp_protocol = ["schemas/v0/*.json"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
